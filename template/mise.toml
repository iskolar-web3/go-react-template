[tools]
go = "1.27.4"
node = "26.13.0"
pnpm = "12.7.0"
"aqua:golangci/golangci-lint" = "2.15.0"
"aqua:pressly/goose" = "3.29.0"
"aqua:evilmartians/lefthook" = "2.2.2"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.10.0"

[hooks]
postinstall = "lefthook install"

[tasks.deps]
description = "Install server and web dependencies"
run = [
  "cd server && go mod download",
  "cd web && pnpm install --frozen-lockfile",
]

[tasks.lint]
description = "Run linters"
run = [
  "cd server && golangci-lint run",
  "cd web && pnpm lint && pnpm typecheck",
]

[tasks.test]
description = "Run server tests"
usage = 'flag "-v --verbose" help="Enable verbose output"'
dir = "server"
run = "go test ./... ${usage_verbose:+-v}"

[tasks.security]
description = "Run all security checks"
run = "mise run --continue-on-error 'security:**'"

[tasks."security:server:vuln"]
description = "Server: known CVEs in Go code and stdlib (govulncheck)"
dir = "server"
run = "govulncheck ./..."

[tasks."security:server:lint"]
description = "Server: Go security lint (gosec)"
dir = "server"
run = "golangci-lint run --enable-only gosec ./..."

[tasks."security:web:audit"]
description = "Web: npm advisories, high and above (pnpm audit, same as CI)"
dir = "web"
run = "pnpm audit --audit-level=high --prod"

[tasks.format]
description = "Format code"
run = ["cd server && go fmt ./...", "cd web && pnpm fmt"]

[tasks."dev:server"]
description = "Run server (dev)"
dir = "server"
run = "go build -o bin/server . && exec bin/server"

[tasks."dev:web"]
description = "Run web (dev)"
dir = "web"
run = "pnpm dev"

[tasks.dev]
description = "Run database, server and web (dev)"
run = """
mise run db:start
trap 'mise run db:stop' EXIT
mise run dev:server ::: dev:web
"""

[tasks."db:start"]
description = "Start Postgres and wait until healthy"
dir = "server"
run = "docker compose up -d --wait postgres"

[tasks."db:stop"]
description = "Stop Postgres (data kept)"
dir = "server"
run = "docker compose stop"
