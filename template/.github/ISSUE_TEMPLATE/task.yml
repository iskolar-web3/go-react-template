name: Task
description: Create a specific development or maintenance task.
title: "[Task]: "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        ## Reminder
        To help the team understand the task quickly, please describe it as accurately and concisely as possible.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe what needs to be done.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why?
      description: Describe why this needs to be done.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Expected Outcome
      description: What should be accomplished?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How can we verify that this task is complete?
      placeholder: |
        - [ ] Requirement 1
        - [ ] Requirement 2
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Depends On
      description: Provide any dependencies for this task.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional Context
      description: Relevant links or technical notes.
    validations:
      required: false
